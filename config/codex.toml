# Copy to .codex/config.toml and replace both absolute path placeholders.
# The launcher derives all checkout paths; VICE data remains machine-local.
[mcp_servers.c64bridge]
command = "python3"
args = ["/ABSOLUTE/PATH/TO/sid-song-crafter/scripts/launch-c64bridge.py"]
startup_timeout_sec = 30

[mcp_servers.c64bridge.env]
VICE_DIRECTORY = "/ABSOLUTE/PATH/TO/VICE_DATA"
